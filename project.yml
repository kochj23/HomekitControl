name: HomekitControl
options:
  bundleIdPrefix: com.jordankoch
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"

packages:
  NovaAIKit:
    url: https://github.com/kochj23/NovaAIKit.git
    from: 1.0.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.4.0"
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_USER_SCRIPT_SANDBOXING: false
    DEVELOPMENT_TEAM: QRRCB8HB3W
    CODE_SIGN_STYLE: Automatic

targets:
  HomekitControl-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Shared
      - iOS
      - path: Resources/Assets.xcassets
    dependencies:
      - package: NovaAIKit
        product: NovaAIKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.kochj.HomeKitTV
        PRODUCT_NAME: HomekitControl
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSHomeKitUsageDescription: "HomekitControl needs HomeKit access to control your smart home devices."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "HomekitControl needs local network access to discover smart home devices."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "HomekitControl uses the microphone for voice commands to control your smart home."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "HomekitControl uses speech recognition to process voice commands for device control."
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "HomekitControl uses your location for presence-based automations and geofencing triggers."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "HomekitControl uses your location for presence-based automations."
        CODE_SIGN_ENTITLEMENTS: Resources/iOS.entitlements
        INFOPLIST_FILE: Resources/iOS-Info.plist

  HomekitControl-tvOS:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - Shared
      - tvOS
      - path: Resources/Assets.xcassets
    dependencies:
      - package: NovaAIKit
        product: NovaAIKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.kochj.HomeKitTV
        PRODUCT_NAME: HomekitControl
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_NSHomeKitUsageDescription: "HomekitControl needs HomeKit access to control your smart home devices."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "HomekitControl needs local network access to discover smart home devices."
        CODE_SIGN_ENTITLEMENTS: Resources/tvOS.entitlements
        INFOPLIST_FILE: Resources/tvOS-Info.plist

  HomekitControl-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Shared
      - macOS
      - path: Resources/Assets.xcassets
    dependencies:
      - package: NovaAIKit
        product: NovaAIKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.jordankoch.HomekitControl-macOS
        PRODUCT_NAME: HomekitControl
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "HomekitControl needs local network access to discover smart home devices."
        CODE_SIGN_ENTITLEMENTS: Resources/macOS.entitlements

  HomekitControlTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Tests/HomekitControlTests
    dependencies:
      - target: HomekitControl-macOS
      - package: NovaAIKit
        product: NovaAIKit
        link: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.jordankoch.HomekitControlTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HomekitControl.app/Contents/MacOS/HomekitControl"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  HomekitControl-iOS:
    build:
      targets:
        HomekitControl-iOS: all
    run:
      config: Debug
    archive:
      config: Release

  HomekitControl-tvOS:
    build:
      targets:
        HomekitControl-tvOS: all
    run:
      config: Debug
    archive:
      config: Release

  HomekitControl-macOS:
    build:
      targets:
        HomekitControl-macOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HomekitControlTests
    archive:
      config: Release
