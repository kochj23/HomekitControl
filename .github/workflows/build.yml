name: Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4

    - name: Build
      run: |
        xcodebuild build \
          -project HomekitControl.xcodeproj \
          -scheme 'HomekitControl-macOS' \
          -destination 'platform=macOS' \
          CODE_SIGNING_ALLOWED=NO \
          | tail -20

    - name: Test
      run: |
        xcodebuild test \
          -project HomekitControl.xcodeproj \
          -scheme 'HomekitControl-macOS' \
          -destination 'platform=macOS' \
          CODE_SIGNING_ALLOWED=NO \
          | tail -50
